<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" role="img" aria-label="Shreeya Pareek - Final-Year B.Sc. IT Student, Aspiring AI and LLM Engineer" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1000" height="230" fill="#000000"/>

  <!-- twinkling stars -->
  <g fill="#ffffff">
    <circle cx="80" cy="40" r="1.8"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="190" cy="95" r="1.2"><animate attributeName="opacity" values="1;0.1;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="30" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="70" r="1.1"><animate attributeName="opacity" values="1;0.15;1" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="590" cy="35" r="1.7"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="85" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="28" r="1.9"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="90" r="1.2"><animate attributeName="opacity" values="1;0.1;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="150" r="1"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="150" r="1.1"><animate attributeName="opacity" values="0.9;0.1;0.9" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- waves -->
  <path fill="#c0c0c0" fill-opacity="0.25" d="M0,170 q125,-40 250,0 t250,0 t250,0 t250,0 t250,0 t250,0 t250,0 t250,0 V230 H0 Z">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="14s" repeatCount="indefinite"/>
  </path>
  <path fill="#c0c0c0" fill-opacity="0.45" d="M0,185 q125,-35 250,0 t250,0 t250,0 t250,0 t250,0 t250,0 t250,0 t250,0 V230 H0 Z">
    <animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="10s" repeatCount="indefinite"/>
  </path>
  <path fill="#c0c0c0" fill-opacity="0.8" d="M0,200 q125,-30 250,0 t250,0 t250,0 t250,0 t250,0 t250,0 t250,0 t250,0 V230 H0 Z">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="7s" repeatCount="indefinite"/>
  </path>

  <!-- text -->
  <text x="500" y="100" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="54" font-weight="700" fill="#ffffff" letter-spacing="2">Shreeya Pareek</text>
  <text x="500" y="140" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#c0c0c0" letter-spacing="1">Final-Year B.Sc. IT Student  |  Aspiring AI &amp; LLM Engineer</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
